name: Actualizar datos

on:
  schedule:
    # 13:10 UTC de lunes a viernes: después de la ventana habitual de publicación
    # de datos macro en EE.UU. (8:30 ET).
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: reloj-datos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # Por defecto checkout se trae un solo commit. Con un historial así de
          # truncado, el "git pull --rebase" del paso de publicación no tiene base
          # sobre la que rebasar y falla. Historial completo.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Autotest sin red
        run: python -u scripts/_selftest.py

      - name: Generar data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/build_data.py

      - name: Comprobar que el fichero es válido
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("docs/data/data.json", encoding="utf-8"))
          assert d["current"]["phase"], "sin fase"
          assert len(d["history"]) > 300, "histórico corto"
          assert len(d["assets"]) > 5, "pocos activos"
          print("fase:", d["current"]["phase"],
                "| confianza:", d["current"]["confidence"],
                "| series:", d["meta"]["series_ok"],
                "| avisos:", len(d["meta"]["warnings"]))
          PY

      - name: Comprobar que la página no se rompe
        run: |
          node --check docs/assets/app.js
          node scripts/check_page.js

      - name: Informe mensual PDF
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/build_report.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Copia de lo generado: si el remoto avanzó mientras corría la build, se
          # reparte sobre lo último en vez de rebasar (los PDF y data.json son
          # ficheros generados: siempre gana la versión recién calculada).
          rm -rf /tmp/pub && mkdir -p /tmp/pub/data /tmp/pub/reports
          cp docs/data/data.json /tmp/pub/data/
          cp -r docs/reports/. /tmp/pub/reports/ 2>/dev/null || true
          for intento in 1 2 3 4 5; do
            git add docs/data/data.json docs/reports
            if git diff --staged --quiet; then
              echo "Sin cambios en los datos."
              exit 0
            fi
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "Publicado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado; actualizando sobre el remoto (intento $intento)…"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pub/data/data.json docs/data/data.json
            mkdir -p docs/reports && cp -r /tmp/pub/reports/. docs/reports/
            sleep $((intento * 5))
          done
          echo "No se pudo publicar tras 5 intentos."
          exit 1
