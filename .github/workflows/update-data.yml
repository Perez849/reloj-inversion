name: Actualizar datos

on:
  schedule:
    # 13:10 UTC de lunes a viernes: después de la ventana habitual de publicación
    # de datos macro en EE.UU. (8:30 ET).
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: reloj-datos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Autotest sin red
        run: python -u scripts/_selftest.py

      - name: Generar data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/build_data.py

      - name: Comprobar que el fichero es válido
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("docs/data/data.json", encoding="utf-8"))
          assert d["current"]["phase"], "sin fase"
          assert len(d["history"]) > 300, "histórico corto"
          assert len(d["assets"]) > 5, "pocos activos"
          print("fase:", d["current"]["phase"],
                "| confianza:", d["current"]["confidence"],
                "| series:", d["meta"]["series_ok"],
                "| avisos:", len(d["meta"]["warnings"]))
          PY

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/data.json docs/data/returns.csv.gz
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
