name: TEMP - Calibrar N_MAX_FI

on:
  workflow_dispatch:

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calibrar N_MAX_FI
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u scripts/_tune_fi_nmax.py
