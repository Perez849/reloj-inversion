name: Actualizar Reloj de la Inversión

on:
  schedule:
    # Cada día a las 06:30 UTC (07:30 hora España invierno / 08:30 verano)
    - cron: '30 6 * * *'
  workflow_dispatch:        # permite ejecución manual desde la pestaña Actions
  push:
    branches: [ main ]
    paths:
      - 'investment_clock.py'
      - 'ic_export_json.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests matplotlib

      - name: Generar data.json
        run: |
          python -u ic_export_json.py docs

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "Auto-actualización del Reloj $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
